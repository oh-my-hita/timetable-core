plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'kotlin-kapt'
}
android {
    namespace 'com.stupidtree.hitax'
    defaultConfig { minSdkVersion 23; targetSdk 33; compileSdk 35
        javaCompileOptions { annotationProcessorOptions { arguments = ["room.schemaLocation": "$projectDir/schemas"] } }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    kotlinOptions { jvmTarget = '1.8' }
}
dependencies {
    compileOnly 'io.github.kajimi16.ohmyhita:plugin-sdk:10.1'
    compileOnly 'androidx.room:room-runtime:2.6.1'
    compileOnly 'androidx.lifecycle:lifecycle-livedata-core:2.8.4'
    compileOnly 'org.mnode.ical4j:ical4j:1.0.2'
    compileOnly 'com.google.code.gson:gson:2.8.9'
    kapt 'androidx.room:room-compiler:2.6.1'
}

def sdkDir = {
    def props = new Properties()
    def f = rootProject.file('local.properties')
    if (f.exists()) f.withInputStream { props.load(it) }
    props.getProperty('sdk.dir') ?: System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
}
tasks.register('buildPluginDex') {
    dependsOn 'assembleRelease'
    group = 'plugin'
    description = '构建 T1 timetable core dex'
    def outDir = layout.buildDirectory.dir('plugin-dex').get().asFile
    doLast {
        def sdk = sdkDir()
        if (!sdk) throw new GradleException('找不到 Android SDK')
        def aar = file("$buildDir/outputs/aar/plugin-release.aar")
        if (!aar.exists()) throw new GradleException("AAR 不存在：$aar")
        outDir.deleteDir(); outDir.mkdirs()
        def jar = new File(outDir, 'classes.jar')
        new java.util.zip.ZipFile(aar).withCloseable { zip ->
            jar.bytes = zip.getInputStream(zip.getEntry('classes.jar')).bytes
        }
        exec {
            commandLine "$sdk/build-tools/35.0.0/d8",
                '--lib', "$sdk/platforms/android-35/android.jar",
                '--min-api', '23', '--output', outDir.absolutePath, jar.absolutePath
        }
        jar.delete()
        def dex = new File(outDir, 'classes.dex')
        println "plugin dex: ${dex.absolutePath} (${dex.length()} bytes)"
    }
}
